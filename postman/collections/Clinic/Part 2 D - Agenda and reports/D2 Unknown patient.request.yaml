$kind: http-request
url: "{{baseUrl}}/api/patients/SS9999/upcoming"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("That patient with that ssnumber does not exist");
      });
    language: text/javascript
examples: .resources/D2 Unknown patient.resources/examples
order: 4000
