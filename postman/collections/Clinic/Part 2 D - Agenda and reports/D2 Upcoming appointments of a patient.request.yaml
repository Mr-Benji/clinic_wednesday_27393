$kind: http-request
url: "{{baseUrl}}/api/patients/SS1001/upcoming"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("From today, SCHEDULED or CONFIRMED, soonest first", function () {
          const appointments = pm.response.json();
          const today = new Date().toISOString().slice(0, 10);
          const dates = appointments.map(a => a.appointmentDate);
          pm.expect(appointments.length).to.be.above(0);
          pm.expect(dates).to.eql([...dates].sort());
          appointments.forEach(a => {
              pm.expect(a.appointmentDate >= today).to.be.true;
              pm.expect(["SCHEDULED", "CONFIRMED"]).to.include(a.status);
          });
      });
    language: text/javascript
examples: .resources/D2 Upcoming appointments of a patient.resources/examples
order: 3000
