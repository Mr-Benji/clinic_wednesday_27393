$kind: http-request
url: "{{baseUrl}}/api/doctors/search?name=gis"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Finds Mugisha", function () {
          const lastNames = pm.response.json().map(d => d.lastName);
          pm.expect(lastNames).to.include("Mugisha");
      });
    language: text/javascript
order: 5000
