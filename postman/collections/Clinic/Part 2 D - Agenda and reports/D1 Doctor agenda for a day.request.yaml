$kind: http-request
url: "{{baseUrl}}/api/doctors/{{doctorId}}/agenda?date=2026-10-20"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Only that day and no CANCELLED appointments", function () {
          const appointments = pm.response.json();
          pm.expect(appointments.length).to.be.above(0);
          appointments.forEach(a => {
              pm.expect(a.appointmentDate).to.eql("2026-10-20");
              pm.expect(a.status).to.not.eql("CANCELLED");
          });
      });
    language: text/javascript
examples: .resources/D1 Doctor agenda for a day.resources/examples
order: 1000
