$kind: http-request
url: "{{baseUrl}}/api/patients/of-doctor/{{doctorId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Each patient is listed once", function () {
          const ids = pm.response.json().map(function (p) { return p.id; });
          pm.expect(new Set(ids).size).to.eql(ids.length);
      });
    language: text/javascript
examples: .resources/B4 Patients of a doctor.resources/examples
order: 5000
