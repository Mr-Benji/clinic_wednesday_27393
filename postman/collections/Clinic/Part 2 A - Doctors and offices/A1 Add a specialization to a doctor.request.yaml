$kind: http-request
url: "{{baseUrl}}/api/doctors/{{doctorNoOfficeId}}/specializations/{{unusedSpecializationId}}"
method: PUT
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("Specialization added to the doctor");
      });
    language: text/javascript
examples: .resources/A1 Add a specialization to a doctor.resources/examples
order: 2000
