$kind: http-request
url: "{{baseUrl}}/api/offices/free"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Only office 104 is free", function () {
          const numbers = pm.response.json().map(o => o.officeNumber);
          pm.expect(numbers).to.eql([104]);
      });
    language: text/javascript
order: 1000
