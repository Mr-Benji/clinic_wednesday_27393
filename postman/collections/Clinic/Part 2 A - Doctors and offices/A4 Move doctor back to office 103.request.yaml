$kind: http-request
url: "{{baseUrl}}/api/doctors/{{doctorNoOfficeId}}/office?officeNumber=103"
method: PATCH
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("Office changed successfully");
      });
