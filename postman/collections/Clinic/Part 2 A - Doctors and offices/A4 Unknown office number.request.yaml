$kind: http-request
url: "{{baseUrl}}/api/doctors/{{doctorNoOfficeId}}/office?officeNumber=999"
method: PATCH
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("The office with that office number does not exist");
      });
    language: text/javascript
order: 10000
