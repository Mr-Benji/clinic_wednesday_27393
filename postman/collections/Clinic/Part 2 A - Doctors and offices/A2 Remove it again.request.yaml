$kind: http-request
url: "{{baseUrl}}/api/doctors/{{doctorNoOfficeId}}/specializations/{{unusedSpecializationId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", function () {
          pm.response.to.have.status(409);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("The doctor does not have that specialization");
      });
    language: text/javascript
examples: .resources/A2 Remove it again.resources/examples
order: 7000
