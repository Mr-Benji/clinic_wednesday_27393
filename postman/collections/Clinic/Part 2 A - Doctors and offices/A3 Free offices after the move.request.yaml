$kind: http-request
url: "{{baseUrl}}/api/offices/free"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Office 103 is free now", function () {
          const numbers = pm.response.json().map(o => o.officeNumber);
          pm.expect(numbers).to.eql([103]);
      });
    language: text/javascript
examples: .resources/A3 Free offices after the move.resources/examples
order: 14000
