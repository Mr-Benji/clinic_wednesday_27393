$kind: http-request
url: "{{baseUrl}}/api/doctors/{{doctorNoOfficeId}}/specializations/{{unusedSpecializationId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("Specialization removed from the doctor");
      });
    language: text/javascript
examples: .resources/A2 Remove a specialization from a doctor.resources/examples
order: 6000
