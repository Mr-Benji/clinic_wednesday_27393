$kind: http-request
url: "{{baseUrl}}/api/appointments/update/{{tempAppointmentId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "appointmentDate": "2026-12-02",
        "reason": "Postman flow test",
        "status": "CANCELLED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("Appointment updated successfully");
      });
    language: text/javascript
examples: .resources/B2 Update does not change the status.resources/examples
order: 16000
