$kind: http-request
url: "{{baseUrl}}/api/appointments/{{tempAppointmentId}}/reschedule?newDate=2026-12-02"
method: PATCH
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("Appointment rescheduled successfully");
      });
    language: text/javascript
order: 9000
