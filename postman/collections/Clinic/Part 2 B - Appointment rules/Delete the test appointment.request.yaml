$kind: http-request
url: "{{baseUrl}}/api/appointments/delete/{{tempAppointmentId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("Appointment deleted successfully");
      });
    language: text/javascript
order: 18000
