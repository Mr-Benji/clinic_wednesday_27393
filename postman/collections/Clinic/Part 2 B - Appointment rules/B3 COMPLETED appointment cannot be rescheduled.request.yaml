$kind: http-request
url: "{{baseUrl}}/api/appointments/{{tempAppointmentId}}/reschedule?newDate=2026-12-04"
method: PATCH
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("A COMPLETED appointment cannot be rescheduled");
      });
    language: text/javascript
order: 15000
