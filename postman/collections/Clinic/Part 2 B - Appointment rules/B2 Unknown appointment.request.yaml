$kind: http-request
url: "{{baseUrl}}/api/appointments/00000000-0000-0000-0000-000000000000/status?status=CONFIRMED"
method: PATCH
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("The appointment with that id does not exist");
      });
    language: text/javascript
examples: .resources/B2 Unknown appointment.resources/examples
order: 6000
