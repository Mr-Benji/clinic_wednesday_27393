$kind: http-request
url: "{{baseUrl}}/api/appointments/{{tempAppointmentId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("New date and status", function () {
          pm.expect(pm.response.json().appointmentDate).to.eql("2026-12-02");
          pm.expect(pm.response.json().status).to.eql("SCHEDULED");
      });
    language: text/javascript
examples: .resources/B3 Rescheduled appointment is SCHEDULED again.resources/examples
order: 10000
