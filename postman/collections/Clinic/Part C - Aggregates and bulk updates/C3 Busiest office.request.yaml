$kind: http-request
url: "{{baseUrl}}/api/offices/busiest"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Name, number and count", function () {
          const row = pm.response.json();
          pm.expect(row).to.have.lengthOf(3);
      });
    language: text/javascript
order: 3000
