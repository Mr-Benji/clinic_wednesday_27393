$kind: http-request
url: "{{baseUrl}}/api/appointments/stats/by-status"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Each row is a status and its count", function () {
          pm.response.json().forEach(function (row) {
              pm.expect(row[0]).to.be.oneOf(["SCHEDULED", "CONFIRMED", "COMPLETED", "CANCELLED"]);
              pm.expect(row[1]).to.be.above(0);
          });
      });
    language: text/javascript
examples: .resources/C1 Appointments per status.resources/examples
order: 1000
