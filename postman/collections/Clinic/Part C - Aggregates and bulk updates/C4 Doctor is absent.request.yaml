$kind: http-request
url: "{{baseUrl}}/api/appointments/cancel-day?doctorId={{doctorId}}&date=2026-10-20"
method: PATCH
queryParams:
  doctorId: "{{doctorId}}"
  date: 2026-10-20
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Message gives the number cancelled", function () {
          pm.expect(pm.response.text()).to.match(/^\d+ appointments cancelled$/);
      });
    language: text/javascript
order: 4000
