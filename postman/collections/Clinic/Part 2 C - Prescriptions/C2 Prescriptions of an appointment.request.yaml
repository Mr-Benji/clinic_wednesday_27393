$kind: http-request
url: "{{baseUrl}}/api/prescriptions/appointment/{{appointmentId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("The new prescription is in the list", function () {
          const prescription = pm.response.json().find(p => p.medicineName === "Test medicine");
          pm.expect(prescription.dosage).to.eql("1 tablet, 3 times a day");
          pm.expect(prescription.issuedDate).to.eql(new Date().toISOString().slice(0, 10));
          pm.collectionVariables.set("tempPrescriptionId", prescription.id);
      });
    language: text/javascript
order: 4000
