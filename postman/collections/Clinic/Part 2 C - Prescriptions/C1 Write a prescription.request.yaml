$kind: http-request
url: "{{baseUrl}}/api/prescriptions/save?appointmentId={{appointmentId}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "medicineName": "Test medicine",
        "dosage": "1 tablet, 3 times a day",
        "durationDays": 7
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("Prescription saved successfully");
      });
    language: text/javascript
examples: .resources/C1 Write a prescription.resources/examples
order: 1000
