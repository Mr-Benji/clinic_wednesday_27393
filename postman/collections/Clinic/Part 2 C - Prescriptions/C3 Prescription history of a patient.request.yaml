$kind: http-request
url: "{{baseUrl}}/api/prescriptions/patient/SS1001"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Newest issued date first", function () {
          const dates = pm.response.json().map(p => p.issuedDate);
          pm.expect(dates.length).to.be.above(0);
          pm.expect(dates).to.eql([...dates].sort().reverse());
      });
    language: text/javascript
examples: .resources/C3 Prescription history of a patient.resources/examples
order: 7000
