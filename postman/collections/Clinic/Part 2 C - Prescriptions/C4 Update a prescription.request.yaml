$kind: http-request
url: "{{baseUrl}}/api/prescriptions/update/{{tempPrescriptionId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "medicineName": "Test medicine",
        "dosage": "2 tablets, twice a day",
        "durationDays": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("Prescription updated successfully");
      });
    language: text/javascript
order: 9000
