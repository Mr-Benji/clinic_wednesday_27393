$kind: http-request
url: "{{baseUrl}}/api/prescriptions/save?appointmentId={{notCompletedAppointmentId}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "medicineName": "Test medicine",
        "dosage": "1 tablet, 3 times a day",
        "durationDays": 7
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Message", function () {
          pm.expect(pm.response.text()).to.eql("Prescriptions are only for COMPLETED appointments");
      });
    language: text/javascript
order: 2000
