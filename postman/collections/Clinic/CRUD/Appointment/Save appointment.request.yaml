$kind: http-request
url: "{{baseUrl}}/api/appointments/save?patientId={{tempPatientId}}&doctorId={{tempDoctorId}}"
method: POST
headers:
  Content-Type: application/json
queryParams:
  patientId: "{{tempPatientId}}"
  doctorId: "{{tempDoctorId}}"
body:
  type: json
  content: |-
    {
        "appointmentDate": "2026-12-01",
        "reason": "Postman test",
        "status": "SCHEDULED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
examples: .resources/Save appointment.resources/examples
order: 1000
