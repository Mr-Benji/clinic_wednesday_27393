$kind: http-request
url: "{{baseUrl}}/api/appointments/update/{{tempAppointmentId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "appointmentDate": "2026-12-02",
        "reason": "Postman test",
        "status": "CONFIRMED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
examples: .resources/Update appointment.resources/examples
order: 5000
