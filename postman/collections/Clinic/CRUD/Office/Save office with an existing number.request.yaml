$kind: http-request
url: "{{baseUrl}}/api/offices/save"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Duplicate",
        "officeNumber": 101
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", function () {
          pm.response.to.have.status(409);
      });
    language: text/javascript
examples: .resources/Save office with an existing number.resources/examples
order: 2000
