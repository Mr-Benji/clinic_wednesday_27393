$kind: http-request
url: "{{baseUrl}}/api/doctors/update/{{tempDoctorId}}?officeId={{officeId}}"
method: PUT
headers:
  Content-Type: application/json
queryParams:
  officeId: "{{officeId}}"
body:
  type: json
  content: |-
    {
        "firstName": "Test",
        "lastName": "Doctor",
        "dateOfBirth": "1990-02-02"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", function () {
          pm.response.to.have.status(409);
      });
    language: text/javascript
examples: .resources/Assign an office that is taken.resources/examples
order: 6000
