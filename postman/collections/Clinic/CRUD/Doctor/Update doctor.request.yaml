$kind: http-request
url: "{{baseUrl}}/api/doctors/update/{{tempDoctorId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "firstName": "Test",
        "lastName": "Doctor",
        "dateOfBirth": "1990-02-02"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
examples: .resources/Update doctor.resources/examples
order: 5000
