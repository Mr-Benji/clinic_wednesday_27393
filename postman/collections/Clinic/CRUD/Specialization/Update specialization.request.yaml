$kind: http-request
url: "{{baseUrl}}/api/specializations/update/{{tempSpecializationId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Test specialization updated"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
examples: .resources/Update specialization.resources/examples
order: 4000
