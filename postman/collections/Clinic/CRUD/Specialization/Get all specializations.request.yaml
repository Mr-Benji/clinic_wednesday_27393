$kind: http-request
url: "{{baseUrl}}/api/specializations/all"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      const found = pm.response.json().find(function (item) { return item.name === "Test specialization"; });
      pm.test("Test record is in the list", function () {
          pm.expect(found).to.not.be.undefined;
      });
      if (found) { pm.collectionVariables.set("tempSpecializationId", found.id); }
    language: text/javascript
examples: .resources/Get all specializations.resources/examples
order: 2000
