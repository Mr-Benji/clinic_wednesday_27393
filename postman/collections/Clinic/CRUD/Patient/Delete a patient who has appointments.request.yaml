$kind: http-request
url: "{{baseUrl}}/api/patients/delete/{{patientId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", function () {
          pm.response.to.have.status(409);
      });
    language: text/javascript
examples: .resources/Delete a patient who has appointments.resources/examples
order: 5000
