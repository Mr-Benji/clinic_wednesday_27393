$kind: http-request
url: "{{baseUrl}}/api/patients/save"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "firstName": "Test",
        "lastName": "Patient",
        "dateOfBirth": "2000-01-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
examples: .resources/Save patient.resources/examples
order: 1000
