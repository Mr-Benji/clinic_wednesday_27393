$kind: http-request
url: "{{baseUrl}}/api/doctors/workload?start=2026-10-01&end=2026-10-31"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("First name, last name and count, busiest first, no zeros", function () {
          const rows = pm.response.json();
          const counts = rows.map(r => r[2]);
          pm.expect(rows.length).to.be.above(0);
          rows.forEach(r => pm.expect(r.length).to.eql(3));
          counts.forEach(c => pm.expect(c).to.be.above(0));
          pm.expect(counts).to.eql([...counts].sort((a, b) => b - a));
      });
    language: text/javascript
examples: .resources/Bonus Doctor workload in October.resources/examples
order: 2000
