$kind: http-request
url: "{{baseUrl}}/api/doctors/workload?start=2026-10-05&end=2026-10-05"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("The appointment on the start date is counted", function () {
          pm.expect(pm.response.json().length).to.be.above(0);
      });
    language: text/javascript
examples: .resources/Bonus Both dates are included.resources/examples
order: 3000
